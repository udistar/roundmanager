[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  # Disable secrets scanning because it incorrectly flags public client-side API keys
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# 네이버 API는 netlify/functions/naver-*.ts 가 서버 키(NAVER_CLIENT_ID/SECRET, NAVER_SEARCH_ID/SECRET)로 호출한다.
# (예전 /naver-api, /naver-map, /naver-search 프록시 리다이렉트는 브라우저가 비밀키를 보내야 해서 제거)

[dev]
  command = "npm run dev"
  targetPort = 3003
  port = 8888
  framework = "#custom"
